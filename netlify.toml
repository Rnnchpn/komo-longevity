    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/media*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
