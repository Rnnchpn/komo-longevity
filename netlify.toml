[build]
command = "node scripts/build.mjs && node scripts/after-build.mjs && node scripts/mobile-nav-fix.mjs && node scripts/remove-masterclass-visual.mjs && node scripts/masterclass-review-optin.mjs && node scripts/media-seo.mjs && node scripts/media-webp.mjs"
publish = "site"

[[redirects]]
  from = "/fr/library"
  to = "/media"
  status = 301
  force = true

[[redirects]]
  from = "/fr/library/*"
  to = "/media"
  status = 301
  force = true

[[redirects]]
  from = "/check"
  to = "/assets/check/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/fr/check"
  to = "/assets/check/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/masterclass"
  to = "/assets/masterclass-v2/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/fr/masterclass"
  to = "/assets/masterclass-v2/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/review"
  to = "/assets/review/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/media"
  to = "/assets/media/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/media/locomotive-syndrome"
  to = "/assets/media/locomotive-syndrome/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/media/walking-is-data"
  to = "/assets/media/walking-is-data/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/media/biomechanics-aging"
  to = "/assets/media/biomechanics-aging/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/media/cone-of-economy"
  to = "/assets/media/cone-of-economy/index.html"
  status = 200
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/check"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/fr/check"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/masterclass"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/review"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/media*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
