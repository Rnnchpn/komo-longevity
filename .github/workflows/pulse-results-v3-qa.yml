name: Pulse Results V3 Browser QA

on:
  push:
    branches:
      - feat/pulse-results-v3-final
  workflow_dispatch:

jobs:
  pulse-results-v3-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build canonical production output
        run: npm run build

      - name: Start local production server
        run: |
          python3 -m http.server 4173 --directory site > /tmp/komo-pulse-results-v3-http.log 2>&1 &
          echo $! > /tmp/komo-pulse-results-v3-http.pid
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/pulse-v12/ > /dev/null

      - name: Validate Results V3 desktop iPad mobile
        run: node scripts/pulse-results-v3-browser-qa.mjs

      - name: Upload Results V3 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-results-v3-browser-qa
          path: artifacts/pulse-results-v3/*
          if-no-files-found: warn
          retention-days: 7
