name: Pulse Full Build Diagnostic

on:
  push:
    branches: [main]

jobs:
  pulse-full-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
