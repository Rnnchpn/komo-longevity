name: Pulse Full Build Diagnostic

on:
  push:
    branches:
      - main

jobs:
  pulse-full-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run full production build
        run: npm run build
