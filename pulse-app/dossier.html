<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>KŌMØ Pulse — Dossier patient</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f5f2eb;--card:#fff;--ink:#26372d;--muted:#778078;--line:#e1ddd5;--soft:#efebe3;--green:#293a30;--gold:#b58d4a}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#f8f6f0 0,#f2eee6 100%);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh}.shell{max-width:1240px;margin:0 auto;padding:24px 24px 70px}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:18px;margin:-24px -24px 24px;padding:18px 24px;background:rgba(248,246,240,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:14px}.brand strong{font-family:Manrope,sans-serif;letter-spacing:.12em}.back{display:inline-flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-size:12px;font-weight:600}.hero{background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px 30px;box-shadow:0 10px 35px rgba(34,48,40,.04)}.eyebrow{margin:0;color:#7b837d;font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:700}.hero h1{margin:8px 0 6px;font-family:Manrope,sans-serif;font-size:36px;letter-spacing:-.04em}.meta{margin:0;color:var(--muted);font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:1px solid #d8d4cc;background:#fff;color:var(--ink);border-radius:13px;padding:11px 14px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.approve{background:#edf3eb;border-color:#cad7cb;color:#35503d}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}.card.full{grid-column:1/-1}.card h2{margin:7px 0 14px;font-family:Manrope,sans-serif;font-size:20px;letter-spacing:-.025em}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.score{padding:16px;border-radius:16px;background:#f4f1ea}.score span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em}.score strong{display:block;margin-top:6px;font-size:24px}.step{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid #eeeae3}.step:last-child{border-bottom:0}.step span,.step small{display:block}.step span{font-size:12px}.step small{margin-top:3px;color:var(--muted);font-size:10px}.step b{font-size:11px}.appt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 13px;margin-top:8px;border-radius:14px;background:#f6f2ea}.appt strong,.appt small{display:block}.appt small{margin-top:3px;color:var(--muted)}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:#e8efe8;font-size:10px;font-weight:700}.empty{padding:18px;border:1px dashed #d7d2c9;border-radius:15px;background:#faf8f4;color:var(--muted);font-size:11px}.loading{display:grid;place-items:center;min-height:58vh;text-align:center;color:var(--muted)}.loading strong{display:block;color:var(--ink);font-size:18px;margin-bottom:7px}.error{padding:30px;border:1px solid #ead5ca;border-radius:22px;background:#fff8f3;color:#755b4c}.imports{display:grid;gap:8px}.import-row{padding:11px 12px;border-radius:13px;background:#f4f1ea}.import-row strong,.import-row span{display:block}.import-row span{margin-top:3px;color:var(--muted);font-size:10px}
    #clmImporter{margin-top:16px}.clm-import{display:grid;gap:14px}.clm-drop{padding:18px;border:1px dashed #bfc8bf;border-radius:16px;background:#f8faf7}.clm-drop strong,.clm-drop span{display:block}.clm-drop span{margin:4px 0 12px;color:var(--muted);font-size:11px}.clm-drop input{width:100%}.clm-file{margin-top:10px;color:var(--muted);font-size:10px}.clm-fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.clm-field{display:grid;gap:5px}.clm-field span{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.06em}.clm-field input{width:100%;border:1px solid #d9d5cd;border-radius:11px;padding:10px;background:#fff}.clm-lock-note{padding:11px 12px;border-radius:12px;background:#f3efe6;color:var(--muted);font-size:10px}.clm-actions{margin-top:10px}.clm-btn{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer}.clm-btn.primary{background:var(--green);color:#fff}.clm-import-summary{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.clm-import-summary span{padding:6px 8px;border-radius:999px;background:#eef2ed;font-size:9px}.clm-warning-list{display:grid;gap:5px;margin-top:10px}.clm-warning{padding:8px;border-radius:9px;background:#fff3e8;font-size:9px}.clm-preview{overflow:auto;margin-top:10px}.clm-preview table{width:100%;border-collapse:collapse;font-size:9px}.clm-preview th,.clm-preview td{padding:7px;border-bottom:1px solid #ece8e0;text-align:left}
    #toast{position:fixed;right:22px;bottom:22px;z-index:50;background:#26372d;color:#fff;padding:12px 14px;border-radius:12px;font-size:11px;box-shadow:0 14px 35px rgba(0,0,0,.18)}
    @media(max-width:780px){.shell{padding:14px 14px 50px}.top{margin:-14px -14px 16px;padding:13px 14px}.hero{padding:22px}.hero h1{font-size:29px}.grid{grid-template-columns:1fr}.card.full{grid-column:auto}.scores{grid-template-columns:1fr}.clm-fields{grid-template-columns:1fr}}
  </style>
</head>
<body>

    <header class="top"><div class="brand"><strong>KŌMØ</strong><span>Pulse · Dossier patient</span></div><a class="back" href="./#clinical">← Retour aux patients</a></header>
