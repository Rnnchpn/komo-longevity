<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ELYSIUM — Concierge Desk</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:13px system-ui,Arial;background:#061e2b;color:#f7eddc}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ab93656b;padding:20px 5vw}h1{font:normal 46px Georgia,serif;margin:8px 0}main{max-width:1080px;margin:30px auto;padding:0 18px}.muted{color:#abc3cb}button,input{background:#0b3442;color:#fff;border:1px solid #ad976d;padding:12px;border-radius:7px}button{cursor:pointer}.panel{background:#0b2b39;border:1px solid #bb9b7055;border-radius:12px;padding:22px;margin:14px 0}.row{display:flex;justify-content:space-between;align-items:start;gap:16px;flex-wrap:wrap}.tag{color:#dec394;font-size:11px;letter-spacing:.1em}strong{display:block;font-size:16px;margin:8px 0}small{color:#aac5c8}a{color:#e3c493}.actions{display:flex;gap:10px;flex-wrap:wrap}#status{min-height:20px}article p{line-height:1.6}a.email{overflow-wrap:anywhere}#items:empty:after{content:'No requests to display';color:#abc3cb}@media(max-width:600px){h1{font-size:35px}.panel{padding:16px}}</style></head><body><header><b>KŌMØ · ELYSIUM</b><a href="/elysium/">RETURN TO ELYSIUM</a></header><main><span class="tag">PRIVATE STAFF · CONCIERGE</span><h1>Concierge Desk</h1><p class="muted">Incoming commercial requests. Staff access is verified by the database; no clinical information belongs here.</p><section id="login" class="panel"><form id="loginForm"><label for="email">Staff email</label><p><input id="email" type="email" required autocomplete="email"></p><label for="password">Password</label><p><input id="password" type="password" required autocomplete="current-password"></p><button type="submit">SIGN IN</button></form></section><section id="desk" hidden><div class="actions"><button id="refresh">REFRESH REQUESTS</button><button id="signout">SIGN OUT</button></div><p id="count" class="tag"></p><div id="items"></div></section><p id="status" role="status"></p></main><script src="/elysium/assets/supabase.js"></script><script>
(()=>{'use strict';const $=s=>document.querySelector(s);
const sb=window.supabase?.createClient('https://uqlolefsiktbznnymriy.supabase.co','sb_publishable_3sUsinfJ_nMFI44OXozkKQ_jmGG8w7n');
const alertText=s=>{$('#status').textContent=s};
function node(tag,text,cls){const el=document.createElement(tag);if(cls)el.className=cls;el.textContent=text||'';return el}
async function load(){if(!sb)return alertText('Authentication unavailable.');const {data:{user}}=await sb.auth.getUser();if(!user){$('#login').hidden=false;$('#desk').hidden=true;return}
const owner=await sb.rpc('elysium_verified_owner');if(owner.error||owner.data!==true){$('#login').hidden=true;$('#desk').hidden=true;return alertText('This account does not have ELYSIUM concierge administrator access.')}
$('#login').hidden=true;$('#desk').hidden=false;alertText('');await refresh()}
async function refresh(){const {data,error}=await sb.from('elysium_guest_requests').select('id,created_at,role,city,service,guest_name,contact_email,yacht_name,requested_date,logistics_note,referral_code,status').order('created_at',{ascending:false}).limit(100);
if(error)return alertText('Unable to load requests: '+error.message);
const host=$('#items');host.replaceChildren();$('#count').textContent=(data||[]).length+' MOST RECENT REQUESTS';
for(const x of data||[]){const card=node('article','','panel'),top=node('div','','row'),name=node('strong',x.guest_name),state=node('span',x.status.toUpperCase(),'tag');top.append(name,state);card.append(top,node('small',new Date(x.created_at).toLocaleString()+' · '+x.role+' · '+x.city+' · '+x.service));
card.append(node('p','Yacht: '+(x.yacht_name||'Not specified')+' · Preferred date: '+(x.requested_date||'Flexible')));
if(x.logistics_note)card.append(node('p',x.logistics_note));if(x.referral_code)card.append(node('small','Referral: '+x.referral_code));
const link=node('a','CONTACT CLIENT ↗','email');link.href='mailto:'+encodeURIComponent(x.contact_email)+'?subject='+encodeURIComponent('ELYSIUM private request');card.append(node('p',''),link);host.append(card)}}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error)return alertText('Sign in failed.');await load()});
$('#refresh').addEventListener('click',refresh);$('#signout').addEventListener('click',async()=>{await sb.auth.signOut();await load()});load();
})();
</script></body></html>
