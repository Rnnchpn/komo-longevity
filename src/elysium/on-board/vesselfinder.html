<!doctype html>
<html lang="fr">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="robots" content="noindex,nofollow">
 <title>ELYSIUM · VesselFinder AIS</title>
 <style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071f2b;color:#d9c8a9;font:12px Arial,sans-serif}
  #ais-wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;letter-spacing:.14em;background:linear-gradient(145deg,#071e29,#0a3040);z-index:0}
  #ais-wait span{padding:15px 18px;border:1px solid #d6be9452;border-radius:8px}
  iframe{max-width:100%}
 </style>
</head>
<body>
 <div id="ais-wait"><span>VESSELFINDER · AIS</span></div>
 <script>
  /* Third-party map runs in a same-origin wrapper iframe. Its own script,
     maps, coordinates and cookies are NOT accessed by ELYSIUM application JS. */
  const selected=new URLSearchParams(location.search).get('city');
  const locations=Object.freeze({
   'monaco':{latitude:43.7353,longitude:7.4235,zoom:12},
   'cannes':{latitude:43.55,longitude:7.10,zoom:9},
   'saint-tropez':{latitude:43.2708,longitude:6.639,zoom:12}
  });
  const destination=Object.prototype.hasOwnProperty.call(locations,selected)?selected:'cannes';
  const coords=locations[destination];
  var width='100%';
  var height=String(Math.max(430,window.innerHeight||600));
  var latitude=String(coords.latitude);
  var longitude=String(coords.longitude);
  var centerx=coords.longitude;
  var centery=coords.latitude;
  var zoom=String(coords.zoom);
  var names=true;
 </script>
 <script src="https://www.vesselfinder.com/aismap.js"></script>
 <noscript>Activez JavaScript pour afficher VesselFinder AIS.</noscript>
</body>
</html>
