<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">GLFS-25 questionnaire illustration</title>
  <desc id="desc">A vector illustration of a 25-item questionnaire with five response levels from zero to four.</desc>
