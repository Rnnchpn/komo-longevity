<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#d8cfbb" />
  <title>KŌMØ World · V0.12.2</title>
  <meta name="description" content="KŌMØ World V0.12.2 — premium stone, bronze, glass and water material pass." />
  <link rel="stylesheet" href="../v08/world-v08.css" />
  <link rel="stylesheet" href="../v081/world-v081.css" />
  <link rel="stylesheet" href="../v082/world-v082.css" />
  <link rel="stylesheet" href="../v083/world-v083.css" />
  <link rel="stylesheet" href="../v084/world-v084.css" />
  <link rel="stylesheet" href="../v09/world-v09.css" />
  <link rel="stylesheet" href="../v10/world-v10.css" />
  <link rel="stylesheet" href="../v101/world-v101.css" />
  <link rel="stylesheet" href="../v102/world-v102.css" />
  <link rel="stylesheet" href="../v11/world-v11.css" />
  <link rel="stylesheet" href="../v111/world-v111.css" />
  <link rel="stylesheet" href="../v112/world-v112.css" />
  <link rel="stylesheet" href="../v12/world-v12.css" />
  <link rel="stylesheet" href="../v121/world-v121.css" />
  <link rel="stylesheet" href="./world-v122.css" />
</head>
<body>
  <div id="v122-boot" class="v122-boot"><span>KŌMØ WORLD</span><b>MATERIAL PASS · V0.12.2</b></div>
  <script type="module">
    const source = await fetch('../v121/index.html', { cache:'no-store' });
    if (!source.ok) throw new Error(`Unable to load V0.12.1 shell: ${source.status}`);
    const html = await source.text();
    const parsed = new DOMParser().parseFromString(html,'text/html');
    const sourceApp = parsed.querySelector('#app');
    if (!sourceApp) throw new Error('KŌMØ World shell missing');
    const app = document.importNode(sourceApp,true);
    const version = app.querySelector('.brand i');
    if (version) version.textContent='V0.12.2';
    app.dataset.worldVersion='v122';
    const canvas=app.querySelector('#world-canvas');
    if(canvas) canvas.setAttribute('aria-label','KŌMØ World V0.12.2 premium material pass');
    document.body.insertBefore(app,document.querySelector('#v122-boot'));

    let engine = await (await fetch('../v081/world-v081.js',{cache:'no-store'})).text();
    const twinCoreUrl=new URL('../v04/twin-core.js',location.href).href;
    engine=engine.replace("'../v04/twin-core.js'",JSON.stringify(twinCoreUrl));
    const oldSpeed="speed=keys.has(settings.bindings.sprint)?7.1:4.35";
    if(!engine.includes(oldSpeed)) throw new Error('V0.12.2 locomotion patch target missing');
    engine=engine.replace(oldSpeed,"speed=keys.has(settings.bindings.sprint)?11.4:6.25");
    engine=engine.replace("Math.sin(performance.now()*.012)*.42","Math.sin(performance.now()*.0165)*.48");
    engine=engine.replace("renderer.toneMappingExposure=1.04","renderer.toneMappingExposure=1.12");
    engine=engine.replace("toast('KŌMØ World · V0.8.1')","toast('KŌMØ World · V0.12.2')");
    const exposeAt='function animate(){';
    if(!engine.includes(exposeAt)) throw new Error('V0.12.2 runtime exposure target missing');
    engine=engine.replace(exposeAt,`window.KomoWorldRuntime={THREE,scene,camera,renderer,player,hall,water,sun,fill,spawnRing,top,island,plaza,hallFloor,leftWall,rightWall,backWall,deskBase,deskTop,tree,box,cyl,mat,C};\n${exposeAt}`);
    const blobUrl=URL.createObjectURL(new Blob([engine],{type:'text/javascript'}));
    try{await import(blobUrl)}finally{URL.revokeObjectURL(blobUrl)}

    await import('../v083/world-v083.js');
    await import('../v084/world-v084.js');
    await import('../v09/world-v09.js');
    await import('../v10/world-v10.js');
    await import('../v101/world-v101.js');
    await import('../v102/world-v102.js');
    await import('../v11/world-v11.js');
    await import('../v111/world-v111.js');
    await import('../v112/world-v112.js');
    await import('../v12/world-v12.js');
    await import('../v12/world-v12-spatial.js');
    await import('../v121/world-v121.js');
    await import('./world-v122.js');
    document.querySelector('#v122-boot')?.remove();
  </script>
</body>
</html>
