<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#17271f" />
  <title>KŌMØ World · V0.13.2 Hall Floor</title>
  <meta name="description" content="KŌMØ World V0.13.2 — Hall floor material pass only." />
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17271f}
    #v132-loader{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#17271f;color:#eee6d7;font:700 10px/1 system-ui,sans-serif;letter-spacing:.18em}
  </style>
</head>
<body>
  <div id="v132-loader">KŌMØ WORLD · HALL FLOOR</div>
  <script type="module">
    const loader=document.querySelector('#v132-loader');
    try{
      const r=await fetch('../v131/index.html',{cache:'no-store'});
      if(!r.ok)throw new Error(`V0.13.1 shell ${r.status}`);
      const html=await r.text();
      const doc=new DOMParser().parseFromString(html,'text/html');
      const base=new URL('../v131/',location.href);
      doc.head.querySelectorAll('link[rel="stylesheet"]').forEach(link=>{
        const el=document.createElement('link');el.rel='stylesheet';el.href=new URL(link.getAttribute('href'),base).href;document.head.appendChild(el);
      });
      doc.head.querySelectorAll('style').forEach(style=>{const el=document.createElement('style');el.textContent=style.textContent;document.head.appendChild(el)});
      [...doc.body.children].filter(n=>n.tagName!=='SCRIPT').forEach(n=>document.body.insertBefore(document.importNode(n,true),loader));
      const source=doc.body.querySelector('script[type="module"]')?.textContent;
      if(!source)throw new Error('V0.13.1 runtime script missing');
      const run=document.createElement('script');run.type='module';run.textContent=source;document.body.appendChild(run);

      const wait=setInterval(async()=>{
        if(!window.KomoWorldRuntime||!window.KomoV131Design)return;
        clearInterval(wait);
        try{await import('./world-v132-floor.js')}catch(e){console.error('[V0.13.2] Hall floor pass failed',e)}
        loader?.remove();
      },50);
      setTimeout(()=>{if(document.body.contains(loader)){clearInterval(wait);loader.textContent='KŌMØ WORLD · CHARGEMENT…'}},8000);
    }catch(e){console.error('[V0.13.2] boot error',e);loader.textContent='KŌMØ WORLD · V0.13.2 INDISPONIBLE';setTimeout(()=>location.replace('../v131/'),1000)}
  </script>
</body>
</html>
