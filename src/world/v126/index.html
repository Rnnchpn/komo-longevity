<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#d8cfbb" />
  <title>KŌMØ World · V0.12.6</title>
  <meta name="description" content="KŌMØ World V0.12.6 — fully traversable Hall navigation pass." />
  <link rel="stylesheet" href="../v08/world-v08.css" />
  <link rel="stylesheet" href="../v081/world-v081.css" />
  <link rel="stylesheet" href="../v082/world-v082.css" />
  <link rel="stylesheet" href="../v083/world-v083.css" />
  <link rel="stylesheet" href="../v084/world-v084.css" />
  <link rel="stylesheet" href="../v09/world-v09.css" />
  <link rel="stylesheet" href="../v10/world-v10.css" />
  <link rel="stylesheet" href="../v101/world-v101.css" />
  <link rel="stylesheet" href="../v102/world-v102.css" />
  <link rel="stylesheet" href="../v11/world-v11.css" />
  <link rel="stylesheet" href="../v111/world-v111.css" />
  <link rel="stylesheet" href="../v112/world-v112.css" />
  <link rel="stylesheet" href="../v12/world-v12.css" />
  <link rel="stylesheet" href="../v121/world-v121.css" />
  <link rel="stylesheet" href="../v122/world-v122.css" />
  <link rel="stylesheet" href="../v123/world-v123.css" />
</head>
<body>
  <div id="v126-boot" class="v123-boot"><span>KŌMØ WORLD</span><b>OUVERTURE DU PASSAGE · V0.12.6</b></div>
  <script type="module">
    const boot=document.querySelector('#v126-boot');
    let failed=false;
    try{
      const shellResponse=await fetch('../v081/index.html',{cache:'no-store'});
      if(!shellResponse.ok) throw new Error(`Unable to load KŌMØ World shell: ${shellResponse.status}`);
      const shellHtml=await shellResponse.text();
      const parsed=new DOMParser().parseFromString(shellHtml,'text/html');
      const sourceApp=parsed.querySelector('#app');
      if(!sourceApp) throw new Error('KŌMØ World shell missing');
      const app=document.importNode(sourceApp,true);
      const version=app.querySelector('.brand i');
      if(version) version.textContent='V0.12.6';
      app.dataset.worldVersion='v126';
      const canvas=app.querySelector('#world-canvas');
      if(canvas) canvas.setAttribute('aria-label','KŌMØ World V0.12.6 fully traversable Hall');
      document.body.insertBefore(app,boot);

      let engine=await (await fetch('../v081/world-v081.js',{cache:'no-store'})).text();
      const twinCoreUrl=new URL('../v04/twin-core.js',location.href).href;
      engine=engine.replace("'../v04/twin-core.js'",JSON.stringify(twinCoreUrl));

      const oldSpeed="speed=keys.has(settings.bindings.sprint)?7.1:4.35";
      if(!engine.includes(oldSpeed)) throw new Error('V0.12.6 locomotion patch target missing');
      engine=engine.replace(oldSpeed,"speed=keys.has(settings.bindings.sprint)?11.4:6.25");
      engine=engine.replace("Math.sin(performance.now()*.012)*.42","Math.sin(performance.now()*.0165)*.48");
      engine=engine.replace("renderer.toneMappingExposure=1.04","renderer.toneMappingExposure=1.12");
      engine=engine.replace("toast('KŌMØ World · V0.8.1')","toast('KŌMØ World · V0.12.6')");

      // Navigation fix: remove the obsolete central Desk collider and move the old rear wall collider
      // to the actual rear of the extended atrium. Side boundaries now follow the full Hall depth.
      const oldObstacles="const obstacles=[{x1:-4.9,x2:4.9,z1:-3.55,z2:-1.7},{x1:-24.2,x2:-23.1,z1:-25,z2:9},{x1:23.1,x2:24.2,z1:-25,z2:9},{x1:-24.2,x2:24.2,z1:-25.2,z2:-24.0}];";
      const newObstacles="const obstacles=[{x1:-24.2,x2:-23.1,z1:-43,z2:9},{x1:23.1,x2:24.2,z1:-43,z2:9},{x1:-24.2,x2:24.2,z1:-43.4,z2:-42.3}];";
      if(!engine.includes(oldObstacles)) throw new Error('V0.12.6 collision patch target missing');
      engine=engine.replace(oldObstacles,newObstacles);

      // Hidden legacy Desk/back wall must not pull the third-person camera forward.
      const oldOccluders="const desired=new THREE.Vector3(),target=new THREE.Vector3(),ray=new THREE.Raycaster();const cameraOccluders=[leftWall,rightWall,backWall,deskBase,deskTop];";
      const newOccluders="const desired=new THREE.Vector3(),target=new THREE.Vector3(),ray=new THREE.Raycaster();const cameraOccluders=[leftWall,rightWall];";
      if(!engine.includes(oldOccluders)) throw new Error('V0.12.6 camera occluder patch target missing');
      engine=engine.replace(oldOccluders,newOccluders);

      const exposeAt='function animate(){';
      if(!engine.includes(exposeAt)) throw new Error('V0.12.6 runtime exposure target missing');
      engine=engine.replace(exposeAt,`window.KomoWorldRuntime={THREE,scene,camera,renderer,player,hall,water,sun,fill,spawnRing,top,island,plaza,hallFloor,leftWall,rightWall,backWall,deskBase,deskTop,tree,box,cyl,mat,C};\n${exposeAt}`);

      const blobUrl=URL.createObjectURL(new Blob([engine],{type:'text/javascript'}));
      try{await import(blobUrl)}finally{URL.revokeObjectURL(blobUrl)}

      await import('../v083/world-v083.js');
      await import('../v084/world-v084.js');
      await import('../v09/world-v09.js');
      await import('../v10/world-v10.js');
      await import('../v101/world-v101.js');
      await import('../v102/world-v102.js');
      await import('../v11/world-v11.js');
      await import('../v111/world-v111.js');
      await import('../v112/world-v112.js');
      await import('../v12/world-v12.js');
      await import('../v12/world-v12-spatial.js');
      await import('../v121/world-v121.js');

      boot?.remove();
      setTimeout(()=>import('../v122/world-v122.js').catch(e=>console.warn('[KŌMØ V0.12.6] Material pass skipped',e)),60);
      setTimeout(()=>import('../v123/world-v123.js').catch(e=>console.warn('[KŌMØ V0.12.6] Forecourt pass skipped',e)),100);
      setTimeout(()=>import('../v124/world-v124.js').catch(e=>console.warn('[KŌMØ V0.12.6] Terrain pass skipped',e)),140);
      setTimeout(()=>import('../v125/world-v125.js').catch(e=>console.error('[KŌMØ V0.12.6] Hall pass failed',e)),190);
    }catch(error){
      failed=true;
      console.error('[KŌMØ V0.12.6] Boot error:',error);
      if(boot) boot.innerHTML='<span>KŌMØ WORLD</span><b>RETOUR À LA VERSION STABLE…</b>';
      setTimeout(()=>location.replace('../v125/'),700);
    }finally{
      if(!failed) boot?.remove();
    }
  </script>
</body>
</html>
